<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Account verification</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 380px; margin: 60px auto; padding: 0 16px; }
      input, button { display: block; width: 100%; margin: 8px 0; padding: 8px; font: inherit; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <h1>Account verification</h1>
    <p>Expected: warning that the password is sent over unencrypted HTTP to another site.</p>
    <form action="http://verify.example.net/login" method="post">
      <input name="user" placeholder="Username" />
      <input name="pass" type="password" placeholder="Password" />
      <button type="submit">Verify</button>
    </form>
    <p><a href="index.html">Back to demos</a></p>
  </body>
</html>
